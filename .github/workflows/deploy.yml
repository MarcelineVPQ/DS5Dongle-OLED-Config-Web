name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Bundle latest firmware UF2 from GitHub releases
        continue-on-error: true
        run: |
          mkdir -p public
          API=$(curl -sfL https://api.github.com/repos/MarcelineVPQ/DS5Dongle-OLED-Edition/releases/latest)
          TAG=$(echo "$API" | jq -r '.tag_name')
          TITLE=$(echo "$API" | jq -r '.name // .tag_name')
          DATE=$(echo "$API" | jq -r '.published_at')
          URL=$(echo "$API" | jq -r '[.assets[] | select(.name | endswith(".uf2") and (contains("debug") | not))][0].browser_download_url')
          ASSET=$(echo "$API" | jq -r '[.assets[] | select(.name | endswith(".uf2") and (contains("debug") | not))][0].name')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No non-debug UF2 in latest release; skipping bundle"
            exit 0
          fi
          curl -sfL -o public/firmware-latest.uf2 "$URL"
          SIZE=$(stat -c %s public/firmware-latest.uf2)
          jq -n --arg tag "$TAG" --arg title "$TITLE" --arg asset "$ASSET" --argjson size "$SIZE" --arg pub "$DATE" \
            '{tag: $tag, title: $title, assetName: $asset, size: $size, publishedAt: $pub}' \
            > public/firmware-latest.json
          echo "Bundled $ASSET ($SIZE bytes) from $TAG / $TITLE"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
