name: npm-audit

on:
  # Once a day and on pull requests (Dependabot's), not on every push (Marcy 2026-11-01).
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Run npm audit on shipped dependencies (fail on high)
        # bash runs it with -eo pipefail: the step fails with npm audit. GitHub's
        # default shell has no pipefail, so it took tee's status and never failed.
        shell: bash
        run: npx -y npm@11.6.2 audit --omit=dev --audit-level=high --json | tee npm_audit_report.json
      - name: Every advisory, dev dependencies included, is fixed or allowlisted with its reason (tools/audit_gate.mjs)
        if: always()
        shell: bash
        run: |
          # npm audit exits 1 whenever it lists anything; the gate below judges the list.
          npx -y npm@11.6.2 audit --json > npm_audit_full.json || true
          node tools/audit_gate.mjs npm_audit_full.json
      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: |
            npm_audit_report.json
            npm_audit_full.json
          retention-days: 30
