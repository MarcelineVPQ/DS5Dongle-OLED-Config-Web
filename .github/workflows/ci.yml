name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A branch can be checked on every runner before it's merged:
  # gh workflow run CI --ref <branch>
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  # The npm bundled with Node 22 (10.x) hits an arborist "edgesOut" crash on
  # this dependency tree; npm 11 resolves it. Pinned, see CONTRIBUTING.md.
  NPM: npx -y npm@11.6.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: $NPM ci
      - name: ESLint (incl. no-floating-promises, no-misused-promises, no-empty)
        run: npx eslint . --max-warnings=1
      - name: Prettier
        run: npx prettier --check .
      - name: Electron security gate
        run: ./.hooks/check_electron_security.sh
      - name: DOM sink gate
        run: ./.hooks/check_dom_sinks.sh
      - name: One theme system (no literal colors)
        run: node .hooks/check_theme_colors.mjs
      - name: Duplicates have a verdict (docs/DEDUPE_AUDIT.md)
        run: node tools/list_duplicates.mjs --check
      - name: No byte-identical files
        run: node tools/check_identical_files.mjs
      - name: Loops that wait or sit on a hot path have a verdict (docs/LOOP_PASS_2026-10.md)
        run: node tools/list_loops.mjs --check
      - name: Kept state (caches, memos, mirrors) has a verdict (docs/CACHE_PASS_2026-10.md)
        run: node tools/list_caches.mjs --check
      - name: Every error path has a verdict, no silent failure (docs/ERROR_PASS_2026-10.md)
        run: node tools/list_errors.mjs --check
      - name: Every acquisition names its release point (docs/LIFETIME_PASS_2026-10.md)
        run: node tools/list_lifetimes.mjs --check
      - name: Every setting is a Row inside a Section (src/desktop/accordion/Section.tsx)
        run: node tools/list_settings.mjs --check
      - name: Long hints sit behind the ⓘ unless they must stay visible (tools/list_hints.mjs)
        run: node tools/list_hints.mjs --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      - run: npx tsc -b

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      - name: Unit, integration and security tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=html

  # The release builds the app on Windows and macOS too and runs the tests
  # there first; running them on Windows on every push catches a
  # Windows-only failure before a release tag does (0.9.4: Games tests).
  # Same on macOS (no Mac to test on by hand: this and the release build are it).
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx -y npm@11.6.2 ci
      - run: npx vitest run
      # The release builds the app here too: bundling must work on this
      # system's file system (case-insensitive on Windows/macOS: 0.9.5-dev.3).
      - run: npx electron-vite build

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx -y npm@11.6.2 ci
      - run: npx vitest run
      # The release builds the app here too: bundling must work on this
      # system's file system (case-insensitive on Windows/macOS: 0.9.5-dev.3).
      - run: npx electron-vite build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      - name: Desktop build
        run: npx electron-vite build
