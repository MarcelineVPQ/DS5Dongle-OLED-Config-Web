# Pre-commit hooks for the DS5 Dongle Configurator (same layout as AVNetworkMonitor)
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Skip hooks: git commit --no-verify (use sparingly)

# `pre-commit install` sets up both: the file checks, and the commit message's privacy check.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^src/flash/picoflash/
      - id: end-of-file-fixer
        exclude: ^src/flash/picoflash/
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$ # tsconfig allows comments
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: Prettier (format check)
        entry: npx prettier --check
        language: system
        files: \.(ts|tsx|js|mjs|json|css|ya?ml)$
        exclude: ^(src/flash/picoflash/|package-lock\.json)
      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings=1
        language: system
        files: \.(ts|tsx|js|mjs)$
      - id: typecheck
        name: TypeScript (tsc -b)
        entry: npx tsc -b
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      # Security gates (allowlists live inside each script).
      - id: electron-security
        name: Block Electron security regressions
        entry: .hooks/check_electron_security.sh
        language: script
        pass_filenames: false
        files: ^(electron|src)/
      - id: dom-sinks
        name: Block raw HTML / eval sinks
        entry: .hooks/check_dom_sinks.sh
        language: script
        pass_filenames: false
        files: ^(electron|src)/
      - id: theme-colors
        name: One theme system (no literal colors)
        entry: node .hooks/check_theme_colors.mjs
        language: system
        pass_filenames: false
        files: ^src/.*\.(css|tsx?)$
      - id: duplicates
        name: Duplicates have a verdict (docs/DEDUPE_AUDIT.md)
        entry: node tools/list_duplicates.mjs --check
        language: system
        pass_filenames: false
        files: ^(src|electron|tools|\.hooks)/.*\.(css|ts|tsx|mjs)$|^docs/DEDUPE_AUDIT\.md$
      - id: loop-verdicts
        name: Loops that wait or sit on a hot path have a verdict
        entry: node tools/list_loops.mjs --check
        language: system
        pass_filenames: false
        files: ^(src|electron)/.*\.(ts|tsx|js)$|^tools/(list_loops|ts_program)\.mjs$
      - id: cache-verdicts
        name: Kept state (caches, memos, mirrors) has a verdict
        entry: node tools/list_caches.mjs --check
        language: system
        pass_filenames: false
        files: ^(src|electron)/.*\.(ts|tsx|js)$|^tools/(list_caches|ts_program)\.mjs$
      - id: error-verdicts
        name: Every error path has a verdict (no silent failure)
        entry: node tools/list_errors.mjs --check
        language: system
        pass_filenames: false
        files: ^(src|electron)/.*\.(ts|tsx|js)$|^src/i18n/locales/en\.json$|^tools/(list_errors|ts_program)\.mjs$
      - id: lifetime-verdicts
        name: Every acquisition names its release point
        entry: node tools/list_lifetimes.mjs --check
        language: system
        pass_filenames: false
        files: ^(src|electron)/.*\.(ts|tsx|js)$|^tools/(list_lifetimes|ts_program)\.mjs$
      - id: settings-gate
        name: Every setting is a Row inside a Section
        entry: node tools/list_settings.mjs --check
        language: system
        pass_filenames: false
        files: ^src/desktop/.*\.tsx$|^tools/list_settings\.mjs$
      - id: hint-gate
        name: Long hints sit behind the ⓘ unless they must stay visible
        entry: node tools/list_hints.mjs --check
        language: system
        pass_filenames: false
        files: ^src/desktop/.*\.tsx$|^src/i18n/locales/en\.json$|^tools/list_(hints|settings)\.mjs$
      - id: identical-files
        name: No byte-identical files
        entry: node tools/check_identical_files.mjs
        language: system
        pass_filenames: false
      - id: doc-gates
        name: Docs name what exists; no secret project's name in a file (tools/doc_gates.mjs)
        entry: node tools/doc_gates.mjs --check refs privacy
        language: system
        pass_filenames: false
        always_run: true
      - id: privacy-commit-msg
        name: No secret project's name in the commit message or the branch's name
        entry: node tools/doc_gates.mjs privacy-msg
        language: system
        stages: [commit-msg]
        always_run: true
