name: Update manifest

# Rebuilds latest.json (the updater's feed) from the latest published app and
# firmware releases. Runs after an app release, daily (to pick up firmware
# releases without a cross-repo token), and on demand. Assets are downloaded
# and hashed by tools/build_manifest.mjs, so the feed never points at a file
# that doesn't exist or doesn't match.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build latest.json from published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/build_manifest.mjs --out latest.json || [ $? -eq 2 ]
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.json
            git commit -m "chore(release): update latest.json"
            git push origin HEAD:master
          else
            echo "latest.json unchanged."
          fi
