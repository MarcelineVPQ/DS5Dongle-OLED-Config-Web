# Desktop packaging. Build with `npm run dist:linux` / `dist:win` / `dist:mac`
# after `npm run build:desktop`. Releases are built in CI on each OS
# by the release workflow on the firmware repo (MarcelineVPQ/DS5Dongle-OLED-Edition,
# .github/workflows/release.yml), which also bundles that release's firmware in
# resources/firmware/; see docs/adr/0005-releases-on-the-firmware-repo.md.
appId: io.github.MarcelineVPQ.DS5DongleConfigurator
productName: DS5 Dongle OLED Edition Configurator
copyright: Copyright © 2026 MarcelineVPQ
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Tray icons, app icon and the Linux setup files, readable at runtime from
# process.resourcesPath/resources (electron/main/index.ts).
extraResources:
  - from: resources
    to: resources
    # The release bundle's CHANGELOG.md is built into the renderer (firmwareChangelog.config.ts), not read at runtime.
    filter: ["**/*", "!firmware/CHANGELOG.md"]
asar: true
# Electron fuses (2026-10-31 app review S1): the shipped binary can't be used
# as a plain Node runtime (ELECTRON_RUN_AS_NODE), ignores NODE_OPTIONS, loads
# the app only from its app.asar and, on Windows and macOS, checks that
# app.asar wasn't edited. Flipping the fuses resets the Mac build's ad-hoc
# signature; a release is then signed with the Developer ID (mac: below). --inspect (the
# EnableNodeCliInspectArguments fuse) is decided per build by the afterPack
# hook: off in released builds, on in dev-tools builds, which the test tools
# drive through it (tools/inspect_fuse.mjs, docs/SECURITY_AUDIT.md). It stays
# out of this list: this list is flipped after the hook and would undo it.
afterPack: ./tools/inspect_fuse.mjs
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true
artifactName: DS5Dongle-OLED-Edition-Configurator-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
  syncDesktopName: true
  synopsis: Configure the DS5 Dongle OLED Edition
  description: Settings, remapping, pairing slots, diagnostics and firmware updates for the DS5 Dongle (DualSense Bluetooth bridge).
  # koffi reads the Windows process list (electron/main/games/winProcs.ts); not needed here.
  files:
    - "!node_modules/koffi{,/**/*}"
    - "!node_modules/@koromix{,/**/*}"

# Per-user installer (owner's choice, 2026-10-14): no admin, installs to
# %LOCALAPPDATA%\Programs, adds a Start menu entry and an uninstaller, starts
# in about a second. Replaces the portable exe, which unpacked ~1 GB to Temp on
# every start (docs/BACKLOG.md). Updates run the new installer silently
# (electron/main/updater.ts). The tray menu still offers a desktop shortcut.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: DS5 Dongle OLED Edition Configurator
  runAfterFinish: true
  # Settings, game profiles and the library stay (a reinstall keeps them).
  deleteAppDataOnUninstall: false
  # Removes the launch-at-login entry the app writes (build/installer.nsh).
  include: build/installer.nsh
  artifactName: DS5Dongle-OLED-Edition-Configurator-${version}-win-x64-setup.exe

mac:
  target:
    - target: zip
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.utilities
  # koffi reads the Windows process list (electron/main/games/winProcs.ts); not needed here.
  files:
    - "!node_modules/koffi{,/**/*}"
    - "!node_modules/@koromix{,/**/*}"
  # Signed with the Developer ID Application certificate when the release
  # workflow passes it in (CSC_LINK / CSC_KEY_PASSWORD, GitHub secrets on the
  # firmware repo, only in the macOS build step), with the hardened runtime,
  # notarized with the App Store Connect API key (APPLE_API_KEY / _ID / _ISSUER)
  # and stapled: the same setup as CorridorKey Desktop. Without those variables
  # (a local build) it stays unsigned. The microphone test needs the
  # audio-input entitlement (build/entitlements.mac.plist) and macOS asks the
  # user once, with this reason.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: The microphone test records a few seconds from your controller's microphone and plays them back on its speaker. Nothing is saved.
