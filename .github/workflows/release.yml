name: Release

# Builds the desktop app for every OS when a version tag is pushed
# (tools/publish.sh creates it), attaches the files to the GitHub release,
# then refreshes latest.json from what was actually published (manifest.yml).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  NPM: npx -y npm@11.6.2

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "DS5 Dongle OLED Edition Configurator $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  build:
    name: Build (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ${{ env.NPM }} ci
        shell: bash
      - name: Tests must pass before anything ships
        run: npx vitest run
        shell: bash
      - name: Build
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --publish never
        shell: bash
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*-win-x64.exe release/*-mac-universal.zip)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  manifest:
    name: Refresh latest.json
    needs: build
    uses: ./.github/workflows/manifest.yml
    permissions:
      contents: write
