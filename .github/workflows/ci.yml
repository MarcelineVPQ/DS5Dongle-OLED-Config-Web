name: CI

on:
  push:
    branches: [master]
    # Docs-only pushes run nothing (Marcy 2026-11-01: CI only where it proves something).
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [master]
    # Docs-only pushes run nothing (Marcy 2026-11-01: CI only where it proves something).
    paths-ignore: ["**.md", "docs/**"]
  # Windows and macOS run only by hand (Marcy 2026-11-01): once before every
  # release tag, and the release itself builds and tests on both:
  # gh workflow run CI --ref master
  workflow_dispatch:

env:
  NODE_VERSION: "22.23.3"
  # The npm bundled with Node 22 (10.x) hits an arborist "edgesOut" crash on
  # this dependency tree; npm 11 resolves it. Pinned, see CONTRIBUTING.md.
  NPM: npx -y npm@11.6.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog gate reads the commits since the last release tag.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: $NPM ci
      - name: ESLint (incl. no-floating-promises, no-misused-promises, no-empty)
        run: npx eslint . --max-warnings=0
      - name: Prettier
        run: npx prettier --check .
      - name: Electron security gate
        run: ./.hooks/check_electron_security.sh
      - name: DOM sink gate
        run: ./.hooks/check_dom_sinks.sh
      - name: One theme system (no literal colors)
        run: node .hooks/check_theme_colors.mjs
      - name: Duplicates have a verdict (docs/DEDUPE_AUDIT.md)
        run: node tools/list_duplicates.mjs --check
      - name: No byte-identical files
        run: node tools/check_identical_files.mjs
      - name: Loops that wait or sit on a hot path have a verdict (docs/LOOP_PASS_2026-10.md)
        run: node tools/list_loops.mjs --check
      - name: Kept state (caches, memos, mirrors) has a verdict (docs/CACHE_PASS_2026-10.md)
        run: node tools/list_caches.mjs --check
      - name: Every error path has a verdict, no silent failure (docs/ERROR_PASS_2026-10.md)
        run: node tools/list_errors.mjs --check
      - name: Every acquisition names its release point (docs/LIFETIME_PASS_2026-10.md)
        run: node tools/list_lifetimes.mjs --check
      - name: Every setting is a Row inside a Section (src/desktop/accordion/Section.tsx)
        run: node tools/list_settings.mjs --check
      - name: Long hints sit behind the ⓘ unless they must stay visible (tools/list_hints.mjs)
        run: node tools/list_hints.mjs --check
      - name: Docs say what the code does (tools/doc_gates.mjs; the tags for the changelog gate)
        run: node tools/doc_gates.mjs --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      - run: npx tsc -b

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      # The firmware repo (public), for the cross-repo tests: the board table
      # (boardsTable.test.ts: boards.json), the protocol version
      # (protocolLockstep.test.ts: src/cmd.h), the version ordering
      # (versionOrder.test.ts: tools/manifest_lib.mjs) and the wording of the
      # changelog About shows (deviceWording.test.ts: CHANGELOG.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MarcelineVPQ/DS5Dongle-OLED-Edition
          path: firmware
          sparse-checkout: |
            boards.json
            src/cmd.h
            tools/manifest_lib.mjs
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Unit, integration and security tests with coverage
        env:
          DS5_FIRMWARE_REPO: ${{ github.workspace }}/firmware
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=html

  # The release builds the app on Windows and macOS too and runs the tests
  # there first. These two jobs run only by hand (Marcy 2026-11-01), once
  # before every release tag, so a Windows-only failure (0.9.4: Games tests)
  # is still caught before the tag: gh workflow run CI --ref master.
  test-macos:
    name: Test (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx -y npm@11.6.2 ci
      - run: npx vitest run
      # The release builds the app here too: bundling must work on this
      # system's file system (case-insensitive on Windows/macOS: 0.9.5-dev.3).
      - run: npx electron-vite build

  test-windows:
    name: Test (Windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx -y npm@11.6.2 ci
      - run: npx vitest run
      # The release builds the app here too: bundling must work on this
      # system's file system (case-insensitive on Windows/macOS: 0.9.5-dev.3).
      - run: npx electron-vite build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build (web + desktop)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $NPM ci
      - name: Desktop build
        run: npx electron-vite build
