# Desktop packaging. Build with `npm run dist:linux` / `dist:win` / `dist:mac`
# after `npm run build:desktop`. Releases are built in CI on each OS
# by the release workflow on the firmware repo (MarcelineVPQ/DS5Dongle-OLED-Edition,
# .github/workflows/release.yml), which also bundles that release's firmware in
# resources/firmware/; see docs/adr/0005-releases-on-the-firmware-repo.md.
appId: io.github.MarcelineVPQ.DS5DongleConfigurator
productName: DS5 Dongle OLED Edition Configurator
copyright: Copyright © 2026 MarcelineVPQ
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Tray icons, app icon and the Linux setup files, readable at runtime from
# process.resourcesPath/resources (electron/main/index.ts).
extraResources:
  - from: resources
    to: resources
    # The release bundle's CHANGELOG.md is built into the renderer (firmwareChangelog.config.ts), not read at runtime.
    filter: ["**/*", "!firmware/CHANGELOG.md"]
asar: true
artifactName: DS5Dongle-OLED-Edition-Configurator-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
  syncDesktopName: true
  synopsis: Configure the DS5 Dongle OLED Edition
  description: Settings, remapping, pairing slots, diagnostics and firmware updates for the DS5 Dongle (DualSense Bluetooth bridge).
  # koffi reads the Windows process list (electron/main/games/winProcs.ts); not needed here.
  files:
    - "!node_modules/koffi{,/**/*}"
    - "!node_modules/@koromix{,/**/*}"

# Per-user installer (owner's choice, 2026-10-14): no admin, installs to
# %LOCALAPPDATA%\Programs, adds a Start menu entry and an uninstaller, starts
# in about a second. Replaces the portable exe, which unpacked ~1 GB to Temp on
# every start (docs/BACKLOG.md). Updates run the new installer silently
# (electron/main/updater.ts). The tray menu still offers a desktop shortcut.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: DS5 Dongle OLED Edition Configurator
  runAfterFinish: true
  # Settings, game profiles and the library stay (a reinstall keeps them).
  deleteAppDataOnUninstall: false
  # Removes the launch-at-login entry the app writes (build/installer.nsh).
  include: build/installer.nsh
  artifactName: DS5Dongle-OLED-Edition-Configurator-${version}-win-x64-setup.exe

mac:
  target:
    - target: zip
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.utilities
  # koffi reads the Windows process list (electron/main/games/winProcs.ts); not needed here.
  files:
    - "!node_modules/koffi{,/**/*}"
    - "!node_modules/@koromix{,/**/*}"
  # The microphone test records from the controller's mic: macOS asks the
  # user once, with this reason. (No entitlements file: the Mac build isn't
  # signed with the hardened runtime; one would need
  # com.apple.security.device.audio-input.)
  extendInfo:
    NSMicrophoneUsageDescription: The microphone test records a few seconds from your controller's microphone and plays them back on its speaker. Nothing is saved.
