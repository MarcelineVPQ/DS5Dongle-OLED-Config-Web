# Pre-commit hooks for the DS5 Dongle Configurator (same layout as AVNetworkMonitor)
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Skip hooks: git commit --no-verify (use sparingly)

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^src/flash/picoflash/
      - id: end-of-file-fixer
        exclude: ^src/flash/picoflash/
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig.*\.json$ # tsconfig allows comments
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: Prettier (format check)
        entry: npx prettier --check
        language: system
        files: \.(ts|tsx|js|mjs|json|css|ya?ml)$
        exclude: ^(src/flash/picoflash/|package-lock\.json)
      - id: eslint
        name: ESLint
        entry: npx eslint --max-warnings=11
        language: system
        files: \.(ts|tsx|js|mjs)$
      - id: typecheck
        name: TypeScript (tsc -b)
        entry: npx tsc -b
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      # Security gates (allowlists live inside each script).
      - id: electron-security
        name: Block Electron security regressions
        entry: .hooks/check_electron_security.sh
        language: script
        pass_filenames: false
        files: ^(electron|src)/
      - id: dom-sinks
        name: Block raw HTML / eval sinks
        entry: .hooks/check_dom_sinks.sh
        language: script
        pass_filenames: false
        files: ^(electron|src)/
